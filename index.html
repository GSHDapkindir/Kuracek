<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GSHD - Galatasaray UCL Kura Odası 2026/2027</title>
    <!-- html2canvas kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --gs-red: #a30000;
            --gs-yellow: #fdb913;
            --bg-color: #0b0f19;
            --card-bg: #121824;
            --text-color: #f8fafc;
            --gold: #ffd700;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Üst Kayan Yazı */
        .ticker-wrap {
            width: 100%;
            background: linear-gradient(90deg, var(--gs-red), #500);
            border-bottom: 2px solid var(--gs-yellow);
            color: var(--gs-yellow);
            font-weight: bold;
            font-size: 13px;
            overflow: hidden;
            white-space: nowrap;
            padding: 8px 0;
            box-shadow: 0 4px 10px rgba(163,0,0,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ticker {
            display: inline-block;
            animation: ticker 18s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translate3d(100vw, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .brand-header img {
            height: 55px;
            filter: drop-shadow(0 0 10px rgba(253, 185, 19, 0.6));
        }

        h1 {
            color: var(--gs-yellow);
            font-size: 20px;
            margin: 0;
            text-transform: uppercase;
        }

        .room-tag {
            background: rgba(163, 0, 0, 0.3);
            border: 1px solid var(--gs-yellow);
            color: var(--gs-yellow);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin: 8px 0 15px 0;
        }

        /* Kontroller */
        .controls {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background: linear-gradient(45deg, var(--gs-red), #5a0000);
            color: white;
            border: 2px solid var(--gs-yellow);
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(163,0,0,0.4);
        }

        button:hover {
            background: linear-gradient(45deg, var(--gs-yellow), #d49700);
            color: black;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-save {
            background: linear-gradient(45deg, #16a34a, #0d5c2b) !important;
            border-color: #4ade80 !important;
        }

        /* Gelişmiş UCL Top Animasyon Alanı */
        #ballAnimationArea {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .ucl-ball {
            width: 45px;
            height: 45px;
            background: url('https://images.seeklogo.com/logo-png/14/1/uefa-champions-league-logo-png_seeklogo-144159.png') center/cover no-repeat;
            border-radius: 50%;
            position: absolute;
            left: -60px;
            filter: drop-shadow(0 0 10px rgba(253, 185, 19, 0.8));
        }

        @keyframes rollInAdvanced {
            0% { left: -60px; transform: rotate(0deg) scale(0.8); }
            50% { left: calc(50% - 22px); transform: rotate(720deg) scale(1.2); }
            75% { left: calc(50% - 22px); transform: rotate(800deg) scale(1); }
            100% { left: calc(50% - 22px); transform: rotate(1080deg) scale(0); opacity: 0; }
        }

        .rolling {
            animation: rollInAdvanced 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* İNDİRİLECEK KART (CAPTURE AREA) */
        #captureArea {
            background: linear-gradient(145deg, #121824, #070a12);
            border: 3px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            margin-top: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: left;
            display: none;
            position: relative;
        }

        /* Tablonun Hemen Üzerindeki Esprili Mesaj Alanı */
        #espriliBanner {
            background: linear-gradient(135deg, var(--gs-red), #400);
            color: var(--gs-yellow);
            border: 2px dashed var(--gs-yellow);
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 12px;
            display: none;
            box-shadow: 0 4px 15px rgba(163,0,0,0.6);
            animation: fadeInScale 0.3s ease-out forwards;
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--gs-red);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-header-left img {
            height: 35px;
        }

        .card-header h2 {
            color: var(--gold);
            margin: 0;
            font-size: 14px;
            text-transform: uppercase;
        }

        .ucl-logo-small {
            height: 30px;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }

        /* Tablo Stili */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        tr.table-row {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }

        th {
            color: var(--gs-yellow);
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(253, 185, 19, 0.2);
            padding-bottom: 5px;
        }

        .td-pot { 
            font-weight: bold; 
            color: var(--gold); 
            width: 65px; 
            border-top-left-radius: 8px; 
            border-bottom-left-radius: 8px; 
        }
        
        .td-team { 
            font-weight: 600; 
            color: #ffffff;
        }
        
        .td-venue {
            text-align: right;
            border-top-right-radius: 8px; 
            border-bottom-right-radius: 8px;
        }

        .venue-tag {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            display: inline-block;
        }
        .home-tag { background: #059669; color: white; border: 1px solid #10b981; }
        .away-tag { background: #dc2626; color: white; border: 1px solid #ef4444; }

        .card-footer {
            margin-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
        }

        .card-footer span {
            color: var(--gs-yellow);
            font-weight: bold;
        }

        /* Alt İmza */
        footer {
            margin-top: 20px;
            padding-top: 10px;
            color: #94a3b8;
            font-size: 13px;
            font-style: italic;
        }

        footer span {
            color: var(--gs-yellow);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Üst Kayan Yazı -->
    <div class="ticker-wrap">
        <div class="ticker">
            🔴🟡 DURSUN ÖZBEK TRANSFERLER NEREDE?? • SABRIMIZ TAŞIYOR• HEDEF 27 • HEDEF AVRUPA 🟡🔴
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <header>
                <div class="brand-header">
                    <img src="https://images.seeklogo.com/logo-png/62/1/galatasaray-5-yildizli-sari-logo-png_seeklogo-620427.png" alt="GS 5 Yıldızlı Logo">
                    <img src="https://images.seeklogo.com/logo-png/14/1/uefa-champions-league-logo-png_seeklogo-144159.png" alt="UCL Logo">
                </div>
                <h1>Galatasaray Kura Odası</h1>
                <div class="room-tag">2026/2027 Sezonu Resmi Simülasyonu</div>
            </header>

            <div class="controls">
                <button id="drawBtn" onclick="startDrawProcess()">Karıştır & Kura Çek</button>
                
                <!-- Animasyon Topu -->
                <div id="ballAnimationArea">
                    <div class="ucl-ball" id="uclBall"></div>
                </div>

                <button id="saveBtn" class="btn-save" onclick="saveAsImage()" style="display:none;">Kurayı Telefona Görsel Olarak İndir</button>
            </div>

            <!-- EKSİKSİZ İNDİRİLECEK ŞIK TABLO KARTI -->
            <div id="captureArea">
                <!-- Tablonun hemen üzerinde rastgele çıkacak esprili alan -->
                <div id="espriliBanner"></div>

                <div class="card-header">
                    <div class="card-header-left">
                        <img src="https://images.seeklogo.com/logo-png/62/1/galatasaray-5-yildizli-sari-logo-png_seeklogo-620427.png" alt="GS">
                        <h2>Galatasaray UCL Rakipleri</h2>
                    </div>
                    <img src="https://images.seeklogo.com/logo-png/14/1/uefa-champions-league-logo-png_seeklogo-144159.png" alt="UCL" class="ucl-logo-small">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Torba</th>
                            <th>Rakip Takım</th>
                            <th style="text-align: right;">Maç Yeri</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- JS ile dolacak -->
                    </tbody>
                </table>
                <div class="card-footer">
                    <span>2026/2027 Sezonu Lig Aşaması</span>
                    <div>GSHD İftiharla Sunar</div>
                </div>
            </div>
        </div>

        <footer>
            <span>GSHD</span> iftiharla sunar...
        </footer>
    </div>

<script>
    const pots = {
        pot1: ["Real Madrid (İspanya)", "Manchester City (İngiltere)", "Bayern Munich (Almanya)", "Paris Saint-Germain (Fransa)", "Inter Milan (İtalya)", "Liverpool (İngiltere)", "Barcelona (İspanya)", "Borussia Dortmund (Almanya)", "Leipzig (Almanya)"],
        pot2: ["Bayer Leverkusen (Almanya)", "Atlético Madrid (İspanya)", "Atalanta (İtalya)", "Juventus (İtalya)", "Benfica (Portekiz)", "Arsenal (İngiltere)", "Club Brugge (Belçika)", "Shakhtar Donetsk (Ukrayna)", "Villarreal (İspanya)"],
        pot3: ["AC Milan (İtalya)", "Feyenoord (Hollanda)", "Sporting CP (Portekiz)", "PSV Eindhoven (Hollanda)", "Dinamo Zagreb (Hırvatistan)", "Salzburg (Avusturya)", "Lille (Fransa)", "Crvena zvezda (Sırbistan)", "Young Boys (İsviçre)"],
        pot4: ["Celtic (İskoçya)", "AS Monaco (Fransa)", "Aston Villa (İngiltere)", "Bologna (İtalya)", "Girona (İspanya)", "Stuttgart (Almanya)", "Sturm Graz (Avusturya)", "Sparta Prag (Çekya)"]
    };

    const espriliMesajlar = [
        "Hay çekeceğin kuraya hocam..",
        "Böyle kura çekilmez yalnız..",
        "Dost musun düşman mı? Hemen yeni kura çek hocam",
        "İyiki kurayı sen çekmiyorsun hocam",
        "BOĞULACAKSAK BÜYÜK DENİZDE BOĞULALIM",
        "Gayet iyi, severiz..."
    ];

    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function showRandomBanner() {
        const banner = document.getElementById('espriliBanner');
        const randomIndex = Math.floor(Math.random() * espriliMesajlar.length);
        banner.innerText = espriliMesajlar[randomIndex];
        banner.style.display = 'block';
    }

    function startDrawProcess() {
        const btnDraw = document.getElementById('drawBtn');
        const btnSave = document.getElementById('saveBtn');
        const captureArea = document.getElementById('captureArea');
        const banner = document.getElementById('espriliBanner');
        const ball = document.getElementById('uclBall');

        btnDraw.disabled = true;
        btnSave.style.display = 'none';
        captureArea.style.display = 'none';
        banner.style.display = 'none';

        // Top animasyonu
        ball.classList.remove('rolling');
        void ball.offsetWidth;
        ball.classList.add('rolling');

        setTimeout(() => {
            generateDrawResults();
            showRandomBanner(); // Tablonun hemen üzerinde esprili mesajı göster
            captureArea.style.display = 'block';
            btnSave.style.display = 'block';
            btnDraw.disabled = false;
        }, 1800);
    }

    function generateDrawResults() {
        let selectedOpponents = [];

        for (let i = 1; i <= 4; i++) {
            let shuffledPot = shuffle([...pots['pot' + i]]);
            let chosen = shuffledPot.slice(0, 2);
            
            chosen.forEach((opp, index) => {
                let venue = (index === 0) ? "İç Saha" : "Deplasman";
                selectedOpponents.push({
                    pot: `Torba ${i}`,
                    team: opp,
                    venue: venue
                });
            });
        }

        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        selectedOpponents.forEach(item => {
            let venueClass = item.venue === "İç Saha" ? "home-tag" : "away-tag";
            tbody.innerHTML += `
                <tr class="table-row">
                    <td class="td-pot">${item.pot}</td>
                    <td class="td-team">${item.team}</td>
                    <td class="td-venue"><span class="venue-tag ${venueClass}">${item.venue}</span></td>
                </tr>
            `;
        });
    }

    function saveAsImage() {
        const captureElement = document.getElementById('captureArea');
        
        setTimeout(() => {
            html2canvas(captureElement, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#121824',
                windowWidth: captureElement.scrollWidth,
                windowHeight: captureElement.scrollHeight
            }).then(canvas => {
                canvas.toBlob(function(blob) {
                    let link = document.createElement('a');
                    link.download = 'gshd_galatasaray_ucl_kura.png';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
                }, 'image/png');
            }).catch(err => {
                alert('Görsel kaydedilemedi: ' + err);
            });
        }, 150);
    }
</script>

</body>
</html>
